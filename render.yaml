services:
  - type: web
    name: worldways-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        value: info@worldwayswebdevelopers.co.ke
      - key: INBOUND_EMAIL_WEBHOOK_SECRET
        generateValue: true
