<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420">
  <defs>
    <filter id="soft" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <g filter="url(#soft)" opacity=".2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">
    <g fill="#1b6848">
      <text x="34" y="42">const buildExperience = async (brief) =&gt; {</text>
      <text x="65" y="70">const audience = await understand(brief);</text>
      <text x="65" y="98">return design.systems(audience).withCare();</text>
      <text x="34" y="126">};</text>
      <text x="330" y="202">function connectPeople(data) {</text>
      <text x="362" y="230">return data.map(item =&gt; makeUseful(item));</text>
      <text x="330" y="258">}</text>
      <text x="82" y="340">&lt;Project quality="thoughtful" /&gt;</text>
    </g>
    <g fill="#507b5a" opacity=".8">
      <text x="332" y="42">export const service = {</text>
      <text x="363" y="70">clarity: true,</text>
      <text x="363" y="98">performance: 'fast',</text>
      <text x="363" y="126">support: 'human'</text>
      <text x="332" y="154">};</text>
      <text x="52" y="202">// Built with people in mind</text>
      <text x="58" y="258">await review.accessibility();</text>
      <text x="82" y="286">launch.whenReady();</text>
      <text x="370" y="340">&lt;/digital-experience&gt;</text>
    </g>
  </g>
</svg>
